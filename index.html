<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Chat App</title>
</head>
<body>

<div id="login">
  <h1>Chat App</h1>
  <p style="color:var(--mute)">Google se login karo aur chat shuru karo</p>
  <button class="btn" id="loginBtn">Google se login</button>
</div>

<div id="nameScreen">
  <h1>Apna naam chuno</h1>
  <p style="color:var(--mute)">Ye naam sabko dikhega. Koi doosra wahi naam nahi le payega.</p>
  <input id="nameInput" maxlength="30" placeholder="Apna naam likho" autocomplete="off">
  <div id="nameErr"></div>
  <button class="btn" id="nameBtn">Aage badho</button>
  <button class="link" id="nameOut">Logout</button>
</div>

<div id="app">
  <div class="side">
    <div class="head"><div id="me">Me</div><span><button class="link" id="newRoom">+ Naya</button> <button class="link" id="logout">Logout</button></span></div>
    <div class="tabs"><button id="tU" class="on">Log</button><button id="tR">Groups / Channels</button></div>
    <div class="search"><input id="q" placeholder="Search…" autocomplete="off"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="chat" id="chat">
    <div class="head"><button class="link" id="back">← Wapas</button><div id="title">Chat chuno</div><span></span></div>
    <div id="msgs"><div class="empty">Left side se kisi ko chuno</div></div>
    <div id="rbar"><span id="rtxt"></span><button class="link" id="rx">✕</button></div>
    <div id="note">Is channel mein sirf owner post kar sakta hai</div>
    <div class="bar" id="bar"><input id="text" maxlength="2000" placeholder="Message likho…" autocomplete="off"><button id="send">Bhejo</button></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
   </html>
